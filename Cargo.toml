[workspace]
resolver = "2"
members = ["crates/codesmith-ai", "crates/codesmith-core", "crates/codesmith"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Skeptic-Dog-Software/codesmith"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
htmd = "0.1"
ignore = "0.4"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
codesmith-ai = { path = "crates/codesmith-ai" }
codesmith-core = { path = "crates/codesmith-core" }

[profile.release]
lto = true
strip = true
codegen-units = 1
