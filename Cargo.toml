[workspace]
resolver = "2"
members = [
    "crates/codesmith-ai",
    "crates/codesmith-core",
    "crates/codesmith",
    "examples/plugin-example",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/reka18/codesmith"
rust-version = "1.91"
readme = "README.md"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
anyhow = "1"
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
flate2 = "1"
crc32fast = "1"
ring = "0.17"
futures-util = "0.3"
hyper = { version = "1", default-features = false, features = ["http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
libc = "0.2"
rand = "0.8"
url = "2.5"
sha2 = "0.10"
minisign-verify = "0.3"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
boa_engine = "0.22.0"
chrono-tz = "0.10.4"
croner = "4.0.3"
ratatui = "0.30"
pulldown-cmark = { version = "=0.13.0", default-features = false }
similar = "=2.7.0"
nucleo-matcher = "=0.3.1"
syntect = { version = "=5.2.0", default-features = false, features = ["default-fancy"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
textwrap = "0.16"
unicode-width = "0.2"
unicode-segmentation = "1"
zstd = { version = "0.13", default-features = false }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
codesmith-ai = { path = "crates/codesmith-ai", version = "0.4.1" }
codesmith-core = { path = "crates/codesmith-core", version = "0.4.1" }

[profile.release]
lto = true
strip = true
codegen-units = 1

# Dependencies are built without debug info in dev and test builds: it roughly
# halves each target folder (several worktrees build at once) while CodeSmith's
# own crates keep full debug info for backtraces and debuggers.
[profile.dev.package."*"]
debug = false
