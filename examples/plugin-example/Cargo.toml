[package]
name = "codesmith-plugin-example"
description = "An example of building CodeSmith with a native plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "codesmith-example"
path = "src/main.rs"

[features]
default = ["remote"]
remote = ["codesmith/remote"]

[dependencies]
codesmith = { path = "../../crates/codesmith", default-features = false }
serde_json.workspace = true
