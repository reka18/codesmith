[package]
name = "codesmith"
description = "A terminal coding agent, fully local and careful with your machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords = ["agent", "llm", "ai", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "codesmith"
path = "src/lib.rs"

[[bin]]
name = "codesmith"
path = "src/main.rs"

[features]
default = ["remote"]
# Remote access from a phone (docs/remote.md): built in, dormant until
# you opt in. `--no-default-features` builds CodeSmith without it.
remote = ["codesmith-core/remote", "dep:qrcode"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
reqwest.workspace = true
codesmith-ai.workspace = true
codesmith-core.workspace = true
tokio.workspace = true
ratatui.workspace = true
axum.workspace = true
chrono.workspace = true
async-stream.workspace = true
futures-util.workspace = true
textwrap.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
ignore.workspace = true
pulldown-cmark.workspace = true
similar.workspace = true
nucleo-matcher.workspace = true
syntect.workspace = true
sha2.workspace = true
minisign-verify.workspace = true
flate2.workspace = true
base64.workspace = true
libc.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio-tungstenite.workspace = true
regex.workspace = true
toml_edit.workspace = true
qrcode = { workspace = true, optional = true }

[dev-dependencies]
vt100 = "0.15"
tempfile.workspace = true
rusqlite.workspace = true
# Test-only minisign signer (ring Ed25519 over a BLAKE2b-512 prehash).
ring.workspace = true
blake2 = "0.10"
