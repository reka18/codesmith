name: CI
# Runs only on a self-hosted runner registered to this repository; there are
# no GitHub-hosted jobs. Without such a runner, jobs wait in the queue.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  scripts:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh
