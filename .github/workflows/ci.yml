# CI: scripts/ci.sh (fmt, clippy -D warnings, every test, shellcheck) on
# the three platforms releases ship for that GitHub hosts for free on a
# public repository. It reads the repository and nothing else: no secrets,
# no write token. Signing and releases stay on the maintainer's Macs (see
# RELEASING.md). Actions are pinned to full commits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -V
      - name: shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: scripts/ci.sh
        run: scripts/ci.sh
